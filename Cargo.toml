[workspace]
members = [
  "crates/picmash",
  "crates/picmash-acceptance",
  "crates/picmash-contract",
  "crates/picmash-engine",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98.0"
version = "0.1.2"

[workspace.lints.rust]
warnings = "deny"
elided_lifetimes_in_paths = "deny"
unexpected_cfgs = "deny"
unsafe_code = "deny"
unused_crate_dependencies = "warn"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -3 }

dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
allow_attributes_without_reason = "deny"

enum_glob_use = "allow"
wildcard_imports = "allow"

missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
struct_field_names = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
float_cmp = "allow"
future_not_send = "allow"
ignored_unit_patterns = "allow"
implicit_hasher = "allow"
items_after_statements = "allow"
manual_let_else = "allow"
many_single_char_names = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_const_for_fn = "allow"
must_use_candidate = "allow"
needless_raw_string_hashes = "allow"
no_effect_underscore_binding = "allow"
option_if_let_else = "allow"
redundant_closure_for_method_calls = "allow"
ref_option = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
significant_drop_tightening = "allow"
single_option_map = "allow"
struct_excessive_bools = "allow"
suboptimal_flops = "allow"
trivially_copy_pass_by_ref = "allow"
unnecessary_wraps = "allow"
unused_async = "allow"
unused_self = "allow"
used_underscore_binding = "allow"

[workspace.metadata.rust-starter]
format_command = ["cargo", "fmt", "--all", "--check"]
clippy_command = [
  "cargo",
  "clippy",
  "--locked",
  "--workspace",
  "--all-targets",
  "--all-features",
]
test_command = ["cargo", "test", "--locked", "--workspace", "--all-targets", "--all-features"]

[workspace.metadata.rust-starter.source_files]
max_lines = 2500

[patch.crates-io]
brass_poolrooms = { path = "../../../brass_poolrooms/.worktrees/cell-walls" }
eternalist-apps = { path = "../../../eternalist_apps/.worktrees/cell-walls" }
egui-tester-witness = { git = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/egui-tester", rev = "2411accb64b9c4012190d1bd0915d68113b8dcf1" }
