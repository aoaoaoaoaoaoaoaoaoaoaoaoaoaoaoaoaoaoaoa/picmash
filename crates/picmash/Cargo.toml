[package]
name = "picmash"
default-run = "picmash"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
autobins = false
description = "Native local-image preference chamber"

[[bin]]
name = "picmash"
path = "src/main.rs"

[features]
egui-test = ["dep:egui-tester-witness", "eternalist-apps/egui-test"]

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
atomic-write-file = "0.3.1"
base64 = "0.23.1"
blake3 = "1.8.2"
brass_poolrooms = "0.14.0"
crossbeam-channel = "0.5.16"
directories = "6.0.0"
egui = "=0.36.1"
egui-wgpu = { version = "=0.36.1", default-features = false }
egui-tester-witness = { version = "0.9.7", optional = true, features = ["egui"] }
eternalist-apps = "0.9.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
jxl-oxide = { version = "0.12.5", features = ["image"] }
md5 = "0.8.0"
picmash-contract = { path = "../picmash-contract" }
picmash-engine = { path = "../picmash-engine" }
pollster = "1.0.1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
toml = "1.1.4"
tempfile = "3.23.0"
ureq = { version = "3.4.0", default-features = false, features = ["native-tls"] }
walkdir = "2.5.0"
wait-timeout = "0.2.1"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.9.0"
