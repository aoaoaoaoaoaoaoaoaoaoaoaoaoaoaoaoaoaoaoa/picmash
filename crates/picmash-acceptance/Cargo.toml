[package]
name = "picmash-acceptance"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
egui-demo = "0.9.14"
egui-tester = "0.9.14"
image = { version = "0.25.10", default-features = false, features = ["png"] }
picmash = { path = "../picmash", features = ["egui-test"] }
picmash-contract = { path = "../picmash-contract" }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
toml = "1.1.5"
ureq = { version = "3.4.0", default-features = false, features = ["native-tls"] }

[lints]
workspace = true
