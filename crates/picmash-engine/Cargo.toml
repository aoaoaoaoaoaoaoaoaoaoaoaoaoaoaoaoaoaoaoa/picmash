[package]
name = "picmash-engine"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
jxl-oxide = { version = "0.12.6", features = ["image"] }
kamadak-exif = "0.6"
parking_lot = "0.12"
rayon = "1"
rusqlite = { version = "0.40", features = ["bundled", "time"] }
thiserror = "2"
time = "0.3"
turbojpeg = { version = "1", features = ["image", "pkg-config"] }
ulid = "3"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
